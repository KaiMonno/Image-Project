services:
  # Backend API (Flask/gunicorn). No rootDir set on purpose: app/catalog.py
  # reads web-project/src/catalogSeed.json, which lives outside
  # web-project/backend/. Setting rootDir: web-project/backend would exclude
  # that file from this service's filesystem entirely and crash on boot.
  - type: web
    name: kaimonno-taste-collage-api
    runtime: python
    plan: free
    buildCommand: cd web-project/backend && pip install -r requirements.txt
    startCommand: cd web-project/backend && gunicorn wsgi:app --worker-class gthread --workers 1 --threads 4
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ALLOWED_ORIGINS
        value: https://kaimonno-taste-collage-web.onrender.com
      # Marked sync: false so Render prompts for these during Blueprint
      # creation instead of storing them in this file. The app already
      # works without them (local catalog only); add them to enable live
      # Spotify/TMDB search.
      - key: TMDB_API_TOKEN
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false

  # Frontend (Create React App static build). rootDir is safe here --
  # everything the frontend needs, including catalogSeed.json, lives under
  # web-project/.
  - type: web
    name: kaimonno-taste-collage-web
    runtime: static
    rootDir: web-project
    buildCommand: npm install && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Baked into the JS bundle at build time (CRA convention), not read
      # at runtime -- changing this after deploy requires a rebuild, not
      # just a restart.
      - key: REACT_APP_API_BASE_URL
        value: https://kaimonno-taste-collage-api.onrender.com
